<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodLink siren test</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 1.5rem auto; padding: 0 1rem; }
  label { display: block; margin-top: .8rem; font-weight: 600; }
  input, select { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: .8rem 1.2rem; font-size: 1.05rem; }
  #log { margin-top: 1rem; background: #f3f3f3; padding: .6rem; white-space: pre-wrap; font-size: .9rem; min-height: 4rem; }
</style>
</head>
<body>
<h2>BloodLink siren test</h2>
<p>Donor ki tarah login karo, phir "Enable alerts" dabao. Uske baad kisi receiver se request daalo.</p>

<label>Phone</label><input id="phone" value="9000000001">
<label>OTP</label><input id="otp" value="1234">
<label>Language</label>
<select id="lang"><option value="hi">Hindi</option><option value="en">English</option></select>

<button id="login">1. Login</button>
<button id="start" disabled>2. Enable alerts</button>

<div id="log"></div>

<script src="/automation/siren.js"></script>
<script>
  var token = null;
  var logBox = document.getElementById("log");
  function log(t) { logBox.textContent = t + "\n" + logBox.textContent; }
  function post(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  document.getElementById("login").onclick = function () {
    var phone = document.getElementById("phone").value.trim();
    var otp = document.getElementById("otp").value.trim();
    post("/auth/otp/send", { phone: phone }).then(function () {
      return post("/auth/otp/verify", { phone: phone, code: otp });
    }).then(function (res) {
      if (res.status === 422) return post("/auth/otp/verify", { phone: phone, otp: otp });
      return res;
    }).then(function (res) {
      token = res.body.token || res.body.access_token || res.body.jwt;
      if (!token) { log("Login failed (" + res.status + "): " + JSON.stringify(res.body)); return; }
      log("Logged in as " + phone + ". Ab 'Enable alerts' dabao.");
      document.getElementById("start").disabled = false;
    }).catch(function (e) { log("Error: " + e); });
  };
  document.getElementById("start").onclick = function () {
    BloodLinkSiren.enable();
    BloodLinkSiren.start({
      baseUrl: "", getToken: function () { return token; },
      language: document.getElementById("lang").value,
      onResult: function (view) { log("Result: " + (view.response || view.kind) + " - " + (view.message || view.text || "")); }
    });
    log("Listening for alerts every 2 s. Receiver se POST /requests chalao (B-).");
    this.disabled = true;
  };
</script>
</body>
</html>
